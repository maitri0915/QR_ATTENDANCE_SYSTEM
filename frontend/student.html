<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student — QR Attendance System</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <div class="brand">Roll<span>Call</span></div>
    <nav id="sideNav">
      <a href="#" data-section="scan" class="active"><span class="label">Scan QR</span></a>
      <a href="#" data-section="attendance"><span class="label">My Attendance</span></a>
      <a href="#" data-section="leave"><span class="label">Leave</span></a>
      <a href="#" data-section="profile"><span class="label">Profile</span></a>
    </nav>
    <div class="logout"><button class="btn-outline btn-block" onclick="Auth.logout()">Log out</button></div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1>Student</h1>
      <div class="who">Signed in as <b id="whoName"></b><span class="role-tag">student</span></div>
    </div>

    <!-- SCAN -->
    <section id="sec-scan">
      <div class="panel" style="text-align:center;">
        <h2>Scan the attendance QR</h2>
        <p>Point your camera at the code your faculty is displaying.</p>
        <div style="max-width:340px; margin:16px auto; border-radius:8px; overflow:hidden; background:#000;">
          <video id="video" style="width:100%; display:block;" playsinline></video>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
        <button id="startScanBtn" onclick="startScan()">Start camera</button>
        <button id="stopScanBtn" class="btn-outline" onclick="stopScan()" style="display:none;">Stop camera</button>
        <div class="error-msg" id="scanErr"></div>
        <div class="success-msg" id="scanOk"></div>
      </div>
    </section>

    <!-- ATTENDANCE -->
    <section id="sec-attendance" style="display:none;">
      <div class="stat-row" id="analyticsRow"></div>
      <div class="panel-head"><h2>Attendance history</h2></div>
      <table class="ledger" id="historyTable">
        <thead><tr><th>Session</th><th>Status</th><th>Method</th><th>Check-in</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- LEAVE -->
    <section id="sec-leave" style="display:none;">
      <div class="panel">
        <h2>Submit a leave request</h2>
        <form id="leaveForm">
          <div class="grid-2">
            <div><label>Start date</label><input type="date" id="leaveStart" required></div>
            <div><label>End date</label><input type="date" id="leaveEnd" required></div>
          </div>
          <label>Reason</label><textarea id="leaveReason" required></textarea>
          <button type="submit" class="btn-block">Submit request</button>
          <div class="error-msg" id="leaveErr"></div>
          <div class="success-msg" id="leaveOk"></div>
        </form>
      </div>

      <div class="panel-head"><h2>My requests</h2></div>
      <table class="ledger" id="leaveTable">
        <thead><tr><th>Dates</th><th>Reason</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- PROFILE -->
    <section id="sec-profile" style="display:none;">
      <div class="panel">
        <h2>My profile</h2>
        <div id="profileView"></div>
        <form id="profileForm" style="margin-top:16px;">
          <label>Phone number</label><input type="text" id="pPhone">
          <label>Division / Section</label><input type="text" id="pDivision">
          <button type="submit" class="btn-block">Save changes</button>
          <div class="success-msg" id="profileOk"></div>
        </form>
      </div>
    </section>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/student.js"></script>
</body>
</html>
