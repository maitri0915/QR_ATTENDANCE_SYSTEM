{% extends "base.html" %}

{% block title %}{{ role_name }} Login{% endblock %}

{% block content %}

<div class="card login-card">

    <h2>{{ role_name }} Login</h2>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

{% endblock %}
