{% extends "base.html" %}

{% block title %}Faculty Registration{% endblock %}

{% block content %}

<div class="card login-card">

    <h2>Faculty Registration</h2>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            required
            maxlength="100"
        >

        <label for="employee_id">Employee ID</label>
        <input
            type="text"
            id="employee_id"
            name="employee_id"
            required
            maxlength="30"
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
            minlength="8"
        >

        <label for="department_id">Department</label>

        <select
            id="department_id"
            name="department_id"
            required
        >
            <option value="">Select Department</option>

            {% for department in departments %}
                <option value="{{ department.id }}">
                    {{ department.code }} - {{ department.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">
            Register
        </button>

    </form>

</div>

{% endblock %}
